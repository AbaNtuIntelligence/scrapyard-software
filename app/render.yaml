services:
  - type: web
    name: scrapsoft-demo
    runtime: python
    repo: https://github.com/AbaNtuIntelligence/scrapyard-software
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/scrapyard-demo.db
