<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrapSoft - Scrap Yard Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 1rem;
            margin: 0.2rem 0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 25px;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .card-stats {
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .card-stats:hover {
            transform: translateY(-5px);
        }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 p-0 sidebar">
                <div class="p-4">
                    <h4 class="text-white mb-4">
                        <i class="fas fa-recycle"></i> ScrapSoft
                    </h4>
                    <nav class="nav flex-column">
                        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a class="nav-link {% if active_page == 'new_transaction' %}active{% endif %}" href="{{ url_for('new_transaction') }}">
                            <i class="fas fa-plus-circle"></i> New Transaction
                        </a>
                        <a class="nav-link {% if active_page == 'reports' %}active{% endif %}" href="{{ url_for('reports') }}">
                            <i class="fas fa-chart-bar"></i> Reports
                        </a>
                        <a class="nav-link {% if active_page == 'sellers' %}active{% endif %}" href="{{ url_for('sellers') }}">
                            <i class="fas fa-users"></i> Sellers
                        </a>
                        <a class="nav-link {% if active_page == 'materials' %}active{% endif %}" href="{{ url_for('materials') }}">
                            <i class="fas fa-cubes"></i> Materials & Codes
                        </a>
                        <a class="nav-link {% if active_page == 'scales' %}active{% endif %}" href="{{ url_for('scales_dashboard') }}">
                            <i class="fas fa-balance-scale"></i> Scales
                        </a>
                        <hr class="bg-light">
                        <a class="nav-link" href="{{ url_for('logout') }}">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-0 main-content">
                <nav class="navbar navbar-light bg-white shadow-sm px-4">
                    <div class="container-fluid">
                        <span class="navbar-brand">
                            <i class="fas fa-weight-hanging"></i> Scrap Yard Management System
                        </span>
                        <div class="d-flex">
                            <span class="text-muted me-3">
                                <i class="fas fa-user"></i> {{ session.get('username', 'Admin') }}
                            </span>
                        </div>
                    </div>
                </nav>

                <div class="p-4">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
