{% extends "base.html" %}

{% block content %}
<div class="row">
    {% for scale_id, scale in scales.items() %}
    <div class="col-md-3 mb-4">
        <div class="card h-100">
            <div class="card-header bg-primary text-white">
                <i class="fas fa-balance-scale"></i> {{ scale.name }}
            </div>
            <div class="card-body">
                <h3 id="weight-{{ scale_id }}">---</h3>
                <small class="text-muted">{{ scale.location }}</small>
                <hr>
                <div>Capacity: {{ scale.capacity_kg }} kg</div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    async function refreshWeights() {
        try {
            const response = await fetch('/api/get_all_weights');
            const data = await response.json();
            if (data.success && data.scales) {
                for (const [scaleId, scaleData] of Object.entries(data.scales)) {
                    const el = document.getElementById('weight-' + scaleId);
                    if (el) el.textContent = scaleData.weight.toFixed(1) + ' kg';
                }
            }
        } catch(e) { console.log(e); }
    }
    refreshWeights();
    setInterval(refreshWeights, 5000);
</script>
{% endblock %}
