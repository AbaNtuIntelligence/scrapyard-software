{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="table-container">
            <h5 class="mb-4">
                <i class="fas fa-plus-circle"></i> Record New Transaction
            </h5>
            
            <form method="POST" action="{{ url_for('new_transaction') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Seller Full Name *
                        </label>
                        <input type="text" name="seller_name" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-id-card"></i> ID Number (Police Register) *
                        </label>
                        <input type="text" name="id_number" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-phone"></i> Phone Number
                        </label>
                        <input type="tel" name="phone" class="form-control">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-cube"></i> Material Type *
                        </label>
                        <select name="material_id" id="material_id" class="form-select" required>
                            <option value="">Select material...</option>
                            {% for material in materials %}
                            <option value="{{ material.id }}" data-price="{{ material.price_per_kg }}">
                                {{ material.name }} - R{{ material.price_per_kg }}/kg
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-weight-hanging"></i> Weight (kg) *
                        </label>
                        <input type="number" step="0.01" name="weight" id="weight" class="form-control" required>
                        <small class="text-muted">
                            <i class="fas fa-microchip"></i> 
                            <a href="javascript:void(0)" id="readScaleBtn" class="text-primary">Read from Scale</a>
                        </small>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-calculator"></i> Calculated Amount
                        </label>
                        <input type="text" id="calculated_amount" class="form-control" readonly style="font-size: 1.2rem; font-weight: bold; background-color: #e8f5e9;">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fas fa-save"></i> Save Transaction & Print Ticket
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Get DOM elements
    const materialSelect = document.getElementById('material_id');
    const weightInput = document.getElementById('weight');
    const amountDisplay = document.getElementById('calculated_amount');
    const readScaleBtn = document.getElementById('readScaleBtn');
    
    // Function to calculate and display amount
    function calculateAmount() {
        // Get selected material price from data-price attribute
        const selectedOption = materialSelect.options[materialSelect.selectedIndex];
        const price = selectedOption ? parseFloat(selectedOption.getAttribute('data-price')) : 0;
        
        // Get weight value
        const weight = parseFloat(weightInput.value) || 0;
        
        // Calculate amount
        if (price > 0 && weight > 0) {
            const amount = price * weight;
            amountDisplay.value = 'R ' + amount.toFixed(2);
            // Add a visual indicator
            amountDisplay.style.backgroundColor = '#c8e6c9';
        } else {
            amountDisplay.value = '';
            amountDisplay.style.backgroundColor = '#e8f5e9';
        }
    }
    
    // Add event listeners
    if (materialSelect) {
        materialSelect.addEventListener('change', calculateAmount);
    }
    
    if (weightInput) {
        weightInput.addEventListener('input', calculateAmount);
    }
    
    // Read from scale function
    if (readScaleBtn) {
        readScaleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            const originalText = readScaleBtn.textContent;
            readScaleBtn.textContent = ' Reading...';
            readScaleBtn.style.pointerEvents = 'none';
            
            fetch('/api/get_weight')
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (data.success && data.weight) {
                        weightInput.value = data.weight.toFixed(2);
                        calculateAmount();
                        alert('✓ Weight read successfully: ' + data.weight + ' kg');
                    } else {
                        alert('✗ Could not read from scale. ' + (data.error || 'Please check connection.'));
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    alert('✗ Scale error: Could not connect to server. Make sure the application is running.');
                })
                .finally(function() {
                    readScaleBtn.textContent = originalText;
                    readScaleBtn.style.pointerEvents = 'auto';
                });
        });
    }
    
    // Also calculate on page load if values exist
    if (weightInput.value && materialSelect.value) {
        calculateAmount();
    }
</script>
{% endblock %}
