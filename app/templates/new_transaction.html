{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="table-container">
            <h5 class="mb-4">
                <i class="fas fa-plus-circle"></i> Record New Transaction
            </h5>
            
            <form method="POST" action="{{ url_for('new_transaction') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Seller Full Name *
                        </label>
                        <input type="text" name="seller_name" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-id-card"></i> ID Number (Police Register) *
                        </label>
                        <input type="text" name="id_number" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-phone"></i> Phone Number
                        </label>
                        <input type="tel" name="phone" class="form-control">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-cube"></i> Material Type *
                        </label>
                        <select name="material_id" class="form-select" required>
                            <option value="">Select material...</option>
                            {% for material in materials %}
                            <option value="{{ material.id }}">
                                {{ material.name }} - R{{ material.price_per_kg }}/kg
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-weight-hanging"></i> Weight (kg) *
                        </label>
                        <input type="number" step="0.01" name="weight" id="weight" class="form-control" required>
                        <small class="text-muted">
                            <i class="fas fa-microchip"></i> 
                            <a href="#" id="readScaleBtn" class="text-primary">Read from Scale</a>
                        </small>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="fas fa-calculator"></i> Calculated Amount
                        </label>
                        <input type="text" id="calculated_amount" class="form-control" readonly>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fas fa-save"></i> Save Transaction & Print Ticket
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Calculate amount when weight or material changes
    document.querySelector('select[name="material_id"]').addEventListener('change', calculateAmount);
    document.querySelector('input[name="weight"]').addEventListener('input', calculateAmount);
    
    function calculateAmount() {
        const materialSelect = document.querySelector('select[name="material_id"]');
        const weight = parseFloat(document.querySelector('input[name="weight"]').value) || 0;
        
        if (materialSelect.value) {
            const selectedOption = materialSelect.options[materialSelect.selectedIndex];
            const priceText = selectedOption.text.match(/R([\d.]+)\/kg/);
            if (priceText && weight > 0) {
                const price = parseFloat(priceText[1]);
                const amount = price * weight;
                document.getElementById('calculated_amount').value = 'R ' + amount.toFixed(2);
            } else {
                document.getElementById('calculated_amount').value = '';
            }
        } else {
            document.getElementById('calculated_amount').value = '';
        }
    }
    
    // Read from scale via API
    document.getElementById('readScaleBtn').addEventListener('click', async function(e) {
        e.preventDefault();
        try {
            const response = await fetch('/api/get_weight');
            const data = await response.json();
            if (data.weight) {
                document.querySelector('input[name="weight"]').value = data.weight;
                calculateAmount();
            } else {
                alert('Could not read from scale. Please check connection.');
            }
        } catch (error) {
            alert('Scale error: ' + error.message);
        }
    });
</script>
{% endblock %}
